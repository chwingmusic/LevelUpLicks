<div class="p-6 space-y-6 max-w-7xl mx-auto text-zinc-100">
    <!-- Header & Action Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-zinc-800 pb-5">
        <div>
            <h1 class="text-2xl font-black text-white tracking-tight flex items-center gap-2">
                🎵 Song Repertoire
            </h1>
            <p class="text-xs text-zinc-400 mt-1">
                Manage your songs, music sheets, target BPMs, and mastery progress.
            </p>
        </div>
        <button id="btnAddNewSong" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/10 transition-all flex items-center gap-2 cursor-pointer">
            <span>+ Add New Song</span>
        </button>
    </div>

    <!-- Filters & Search Bar -->
    <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-4 flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="relative w-full sm:w-80">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-500 text-xs">🔍</span>
            <input type="text" id="songSearchInput" placeholder="Search songs, artist, or notes..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-8 pr-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-amber-500 transition-colors">
        </div>
        
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
            <select id="songInstrumentFilter" class="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-300 focus:outline-none focus:border-amber-500">
                <option value="ALL">All Instruments</option>
            </select>
            <span id="songCountBadge" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-zinc-800 text-zinc-400 border border-zinc-700">
                0 Songs
            </span>
        </div>
    </div>

    <!-- Song Cards Grid -->
    <div id="songCardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered dynamically via JS -->
    </div>

    <!-- Add/Edit Song Modal -->
    <div id="songModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 id="songModalTitle" class="text-base font-bold text-white">🎵 Add New Song</h3>
                <button id="btnCloseSongModal" class="text-zinc-400 hover:text-white text-lg font-bold">✕</button>
            </div>

            <form id="songForm" class="space-y-4">
                <!-- 1. Song Title -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Song Title *</label>
                    <input type="text" id="songTitleInput" required placeholder="e.g. Dean Town - Vulfpeck" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 2. Instrument -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Instrument *</label>
                        <select id="songInstrumentSelect" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <!-- 4. Video Link -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Video Link (YouTube / URL)</label>
                        <input type="url" id="songVideoLinkInput" placeholder="https://youtube.com/..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <!-- 5. Key -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Key</label>
                        <select id="songKeySelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"></select>
                    </div>

                    <!-- 5. Mode -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Mode</label>
                        <select id="songModeSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"></select>
                    </div>

                    <!-- 6. Target BPM -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Target BPM</label>
                        <input type="number" id="songTargetBpmInput" min="30" max="300" value="120" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- 7. Mastered BPM (Edit Mode Only) -->
                    <div id="masteredBpmContainer" class="hidden">
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Mastered BPM</label>
                        <input type="number" id="songMasteredBpmInput" min="0" max="300" value="0" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- 8. User Mastery Self-Rating 0-5 (Edit Mode Only) -->
                <div id="masteryRatingContainer" class="hidden bg-zinc-950/60 border border-zinc-800 rounded-xl p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-zinc-400">Execution / Mastery Rating (0 - 5 Stars):</label>
                        <span id="ratingValDisplay" class="text-xs font-bold text-amber-400">0 / 5</span>
                    </div>
                    <input type="range" id="songUserRatingInput" min="0" max="5" step="0.5" value="0" class="w-full accent-amber-500 cursor-pointer">
                    <div class="flex justify-between text-[10px] text-zinc-500">
                        <span>0: Just Started</span>
                        <span>2.5: Comfortable</span>
                        <span>5: Gig Ready</span>
                    </div>
                </div>

                <!-- Mastered Level Output (Read-only preview) -->
                <div id="masteryLevelDisplayContainer" class="hidden bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 text-xs text-amber-300 flex items-center justify-between">
                    <span>Overall Mastery Level:</span>
                    <span id="calculatedMasteryScore" class="font-black text-sm text-amber-400">0.0 / 10</span>
                </div>

                <!-- 3. Music Sheets Attachments -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Music Sheets / Tabs (Multiple Files)</label>
                    <input type="file" id="songSheetFileInput" multiple accept=".pdf,image/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-amber-400 hover:file:bg-zinc-700 cursor-pointer">
                    
                    <!-- Existing Attachments List -->
                    <div id="sheetAttachmentsList" class="mt-2 flex flex-wrap gap-2"></div>
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-between border-t border-zinc-800 pt-4">
                    <button type="button" id="btnDeleteSong" class="px-3 py-2 bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 rounded-xl text-xs font-bold transition-colors hidden">
                        🗑️ Delete Song
                    </button>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" id="btnCancelSongModal" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-semibold transition-colors">
                            Cancel
                        </button>
                        <button type="submit" id="btnSaveSong" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 rounded-xl text-xs font-bold transition-colors">
                            Save Song
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
